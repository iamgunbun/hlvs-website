<body data-page="contact">
  <header id="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html" aria-label="Hasta La Victoria Siempre home"><img src="img/logo.png" alt="Hasta La Victoria Siempre" width="1189" height="276"></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span><span></span>

      <nav id="site-nav" class="nav">
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="tour.html">Shows</a>
        <a href="videos.html">Videos</a>
        <a href="merch.html">Merch</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-head">
      <div class="wrap">
        <p class="eyebrow">Booking // Press // General</p>
        <h1 class="page-title">Contact</h1>
      </div>
    </section>
    <section class="page-body">
      <div class="wrap contact-grid">
        <div>
          <div class="contact-block">
            <h3>Booking</h3>
            <a id="booking-email" href="#"></a>
          </div>
          <div class="contact-block">
            <h3>General / Press</h3>
            <a id="general-email" href="#"></a>
          </div>
          <div class="contact-block">
            <h3>Follow</h3>
            <div id="contact-socials"></div>
          </div>
        </div>

        <form class="form" id="contact-form">
          <div class="form-row">
            <label>Name <input name="name" required autocomplete="name"></label>
            <label>Email <input name="email" type="email" required autocomplete="email"></label>
          </div>
          <label>Topic
            <select name="topic">
              <option>Booking</option>
              <option>Press</option>
              <option>Merch</option>
              <option>Other</option>
            </select>
          </label>
          <label>Message <textarea name="message" required></textarea></label>
          <button class="btn btn-accent" type="submit">Send message</button>
          <p class="muted small mono">Opens your email app with the message ready to send.</p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
